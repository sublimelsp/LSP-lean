name: Smoke test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Lean
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:stable
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Lean
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'elan-init.ps1'
          Invoke-WebRequest https://raw.githubusercontent.com/leanprover/elan/master/elan-init.ps1 -OutFile $installer
          & $installer -NoPrompt 1 -DefaultToolchain leanprover/lean4:stable
          Join-Path $env:USERPROFILE '.elan\bin' | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - uses: sublimelsp/lsp_smoke_test@v1
        with:
          # Provides the Lean syntax that the server is enabled for.
          extra-packages: LexouDuck/SublimeText-Lean
